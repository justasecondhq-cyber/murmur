name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust_target: ""
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_target: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # Works whether the project is at the top of the repository or inside a folder.
      - name: Find the app folder
        shell: bash
        run: |
          if [ -f package.json ] && [ -d src-tauri ]; then
            dir="."
          else
            found=$(find . -maxdepth 3 -name tauri.conf.json -path "*src-tauri*" -not -path "*/node_modules/*" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::Couldn't find the app files. Make sure package.json and the src-tauri folder were uploaded."
              ls -la
              exit 1
            fi
            dir=$(dirname "$(dirname "$found")")
          fi
          echo "App folder: $dir"
          ls -la "$dir"
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libclang-dev cmake build-essential libgtk-3-dev

      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tagName: v__VERSION__
          releaseName: Murmur v__VERSION__
          releaseBody: |
            Download the installer for your computer below.
            - Mac (M1/M2/M3/M4): Murmur_*_aarch64.dmg
            - Mac (Intel): Murmur_*_x64.dmg
            - Windows: Murmur_*_x64-setup.exe
            - Linux: .AppImage, .deb or .rpm
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
