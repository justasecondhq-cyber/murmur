[package]
name = "murmur"
version = "0.1.0"
description = "Free, private, offline AI voice dictation for every app"
authors = ["Murmur contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
hound = "3.5"
arboard = "3"
enigo = "0.2"
active-win-pos-rs = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Speech-to-text. Metal acceleration on macOS; CPU elsewhere by default.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.13"

[features]
# Opt-in NVIDIA GPU acceleration (needs the CUDA toolkit installed when building):
#   npm run tauri build -- --features cuda
cuda = ["whisper-rs/cuda"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
